<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Coupon Manager</title><link rel='stylesheet' href='admin-coupons.css'></head><body><div class='container'><h1>🎁 Coupon Manager</h1><div class='dashboard'><div class='dash-card'><h3 id='total-coupons'>0</h3><p>Total Coupons</p></div><div class='dash-card'><h3 id='active-coupons'>0</h3><p>Active Coupons</p></div><div class='dash-card'><h3 id='expired-coupons'>0</h3><p>Expired Coupons</p></div><div class='dash-card'><h3 id='disabled-coupons'>0</h3><p>Disabled Coupons</p></div></div><div class='card'><h2>Add Coupon</h2><input id='coupon-code'><select id='coupon-type'><option value='percentage'>Percentage</option><option value='flat'>Flat</option></select><input id='coupon-value' type='number'><input id='minimum-order' type='number'><input id='max-discount' type='number'><input id='expiry-date' type='date'><label style="display:block;margin:10px 0;"><input type="checkbox" id="coupon-active" checked> Active Coupon</label><label style="display:block;margin:10px 0;"><input type="checkbox" id="coupon-active" checked> Active Coupon</label><button id="save-coupon">Save Coupon</button></div><div class='card'><h2>Coupon List</h2><table><thead><tr><th>Code</th><th>Type</th><th>Value</th><th>Minimum</th><th>Status</th><th>Action</th></tr></thead><tbody id='coupon-table'></tbody></table></div></div><script type='module' src='admin-coupons.js'></script></body></html>
