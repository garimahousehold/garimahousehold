<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Garima's House Hold</title>

<link rel="icon" href="logo.png">

<link rel="stylesheet" href="checkout.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="header">

<div class="logo">

<a href="index.html">

<img src="logo.png" alt="Garima's House Hold">

</a>

</div>

<h2>

Checkout

</h2>

</header>

<section class="checkout-container">

<div class="checkout-left">

<h2>

Delivery Address

</h2>

<form id="checkout-form">

<div class="input-group">

<label>Full Name</label>

<input
type="text"
id="name"
required>

</div>

<div class="input-group">

<label>Mobile Number</label>

<input
type="tel"
id="mobile"
required>

</div>

<div class="input-group">

<label>Email (Optional)</label>

<input
type="email"
id="email">

</div>

<div class="input-group">

<label>Address</label>

<textarea
id="address"
rows="4"
required></textarea>

</div>

<div class="row">

<div class="input-group">

<label>City</label>

<input
type="text"
id="city"
required>

</div>

<div class="input-group">

<label>State</label>

<input
type="text"
id="state"
required>

</div>

</div>

<div class="row">

<div class="input-group">

<label>Pincode</label>

<input
type="text"
id="pincode"
required>

</div>

<div class="input-group">

<label>Country</label>

<input
type="text"
value="India"
readonly>

</div>

</div>
        <h2>Payment Method</h2>

        <div class="payment-method">

            <label class="payment-option">
                <input type="radio" name="payment" value="UPI" checked>
                UPI Payment
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="Razorpay">
                Razorpay (Cards / UPI / Net Banking)
            </label>

        </div>

        <button type="submit" id="place-order-btn">
            Proceed to Payment
        </button>

        <button type="button" id="whatsapp-order-btn">
            <i class="fa-brands fa-whatsapp"></i>
            Order on WhatsApp
        </button>

    </form>

</div>

<!-- ================= RIGHT SIDE ================= -->

<div class="checkout-right">

    <div class="order-summary">

        <h2>Order Summary</h2>

        <div id="checkout-items">
            <!-- Cart Items will load here -->
        </div>

        <hr>

        <div class="summary-row">
            <span>Items</span>
            <span id="checkout-items-count">0</span>
        </div>

        <div class="summary-row">
            <span>Subtotal</span>
            <span id="checkout-subtotal">₹0</span>
        </div>

        <div class="summary-row">
            <span>Shipping</span>
            <span>FREE</span>
        </div>


        <hr>

        <!-- Coupon Section -->
        <div class="coupon-box">
            <h3>🎁 Apply Coupon</h3>

            <div class="coupon-input">
                <input type="text" id="coupon-code" placeholder="Enter Coupon Code">
                <button type="button" id="apply-coupon">Apply</button>
            </div>

            <button type="button" id="remove-coupon" style="display:none;">
                Remove Coupon
            </button>

            <p id="coupon-message"></p>
        </div>

        <div class="summary-row">
            <span>Discount</span>
            <span id="discount-amount">₹0</span>
        </div>

        <hr>

        <div class="summary-row total">
            <strong>Total</strong>
            <strong id="checkout-total">₹0</strong>
        </div>

    </div>

</div>

</section>

<script type="module" src="firebase.js"></script>
<script type="module" src="checkout.js"></script>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

</body>
</html>
