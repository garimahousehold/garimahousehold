<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Garima's House Hold</title>

    <link rel="stylesheet" href="style.css">

<style>
.products{width:100%;max-width:1400px;margin:0 auto;padding:40px 20px;box-sizing:border-box;}
#wishlist-grid{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;align-items:start;}
#wishlist-grid .product-card{width:100%;min-width:0;overflow:hidden;box-sizing:border-box;}
#wishlist-grid .product-card>img{display:block;width:100%;height:220px;max-height:220px;object-fit:contain;object-position:center;background:#fff;border-radius:12px;box-sizing:border-box;}
#wishlist-grid .product-info{width:100%;box-sizing:border-box;}
@media(max-width:992px){#wishlist-grid{grid-template-columns:repeat(3,minmax(0,1fr));}#wishlist-grid .product-card>img{height:200px;max-height:200px;}}
@media(max-width:700px){.products{padding:25px 12px;}#wishlist-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}#wishlist-grid .product-card>img{height:170px;max-height:170px;}}
@media(max-width:420px){#wishlist-grid .product-card>img{height:150px;max-height:150px;}}
</style>
</head>

<body>

    <header>

        <div class="logo">
            <h2>❤️ My Wishlist</h2>
        </div>

        <div class="header-right">
            <a href="index.html" class="cart-btn">🏠 Home</a>
            <a href="cart.html" class="cart-btn">
                🛒 Cart
                (<span id="cart-count">0</span>)
            </a>
        </div>

    </header>

    <section class="products">

        <h2>Favourite Products</h2>

        <div id="wishlist-grid" class="product-grid">

            <!-- Wishlist Products -->

        </div>

    </section>

    <script type="module" src="wishlist.js"></script>

</body>

</html>
